<!-- Music Entry Template -->
<!-- Copy this template and fill in your details -->
<div class="col-md-6">
    <div class="music-card">
        <h3 class="music-title">TITLE_HERE</h3>
        <p class="music-description">
            <!-- Add your description here. Consider including:
            - What inspired this composition
            - Instruments used
            - Genre/style
            - When it was composed
            - Any special techniques or elements
            -->
        </p>
        <div class="music-metadata">
            <span class="metadata-item">
                <i class="fa fa-calendar"></i> Composed: DATE_HERE
            </span>
            <span class="metadata-item">
                <i class="fa fa-music"></i> Genre: GENRE_HERE
            </span>
        </div>
        <audio class="music-player" controls>
            <source src="/music/FILE_NAME.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <!-- Optional: Add download link -->
        <div class="music-download">
            <a href="/music/FILE_NAME.mp3" download class="download-link">
                <i class="fa fa-download"></i> Download
            </a>
        </div>
    </div>
</div>
